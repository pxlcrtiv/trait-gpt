name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .           # console script: trait-gpt

      - name: Offline test suite (model-dependent tests skip)
        run: python -m pytest tests/ -q -m "not slow" -k "not real_clip"

      - name: CLI smoke — keyless demo path
        run: |
          trait-gpt rank --json | grep -q '"token_id": 7'
          trait-gpt rank --top 2 | grep -q "#7"
          trait-gpt describe 7 | grep -q "gold"
          trait-gpt tags 7 | grep -q "keyword"
          python - <<'EOF'
          import json, subprocess
          out = subprocess.run(["trait-gpt", "stats", "--json"], capture_output=True, text=True)
          d = json.loads(out.stdout)
          assert d["n_tokens"] == 24, d
          assert set(d["traits"]) == {"background", "skin", "eyes", "accessory"}, d
          print("CLI smoke OK:", d["collection"], d["n_tokens"])
          EOF

  # NOTE: GitHub Actions runners currently DO NOT start on this account
  # (billing lock) — the workflow file above is valid and will run once the
  # lock is lifted. Local launchd keeps the daily green bar meanwhile.
  # Daily Green cloud fallback lives in .github/workflows/daily.yml.